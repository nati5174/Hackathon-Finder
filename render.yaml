services:
  - type: web
    name: hackathon-finder-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-finder-db
          property: connectionString

  - type: cron
    name: hackathon-scheduler
    env: python
    region: oregon
    plan: free
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python -m backend.scheduler
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-finder-db
          property: connectionString

databases:
  - name: hackathon-finder-db
    databaseName: hackathon_finder
    plan: free
    region: oregon
