services:
  - type: web
    name: hackathon-finder-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-finder-db
          property: connectionString

  - type: cron
    name: hackathon-scheduler
    env: docker
    region: oregon
    plan: free
    schedule: "0 8 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m backend.scheduler
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-finder-db
          property: connectionString

databases:
  - name: hackathon-finder-db
    databaseName: hackathon_finder
    plan: free
    region: oregon
